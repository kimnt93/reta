[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reta"
version = "0.1.0"
description = "Harness-neutral trading alpha reconstruction and conversion"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "polars==2.0.0",
    "pydantic>=2.12,<3",
    "playwright>=1.55,<2",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
reta = "reta.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "pycodestyle>=2.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/reta"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "reta/skillpacks"

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: exercises actual Playwright Chromium"]
